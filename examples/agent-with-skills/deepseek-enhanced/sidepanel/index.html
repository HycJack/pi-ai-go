<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-width: 300px;
    }
    .header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #4f46e5;
    }
    .button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    .button:hover {
      background: #4338ca;
    }
    .button.secondary {
      background: #f3f4f6;
      color: #374151;
      margin-top: 8px;
    }
    .button.secondary:hover {
      background: #e5e7eb;
    }
    .status {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">系统提示词配置</div>
  <textarea id="prompt-input" placeholder="输入自定义系统提示词..."></textarea>
  <button class="button" id="save-btn">保存设置</button>
  <button class="button secondary" id="reset-btn">恢复默认</button>
  <div class="status" id="status"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
